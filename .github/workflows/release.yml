# Divtech Hisaab - build the setup ZIP and publish it as a GitHub release.
# Run it by pushing a version tag:  git tag v1.11.1 && git push origin --tags
# The tag must match "version" in package.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Tools for the ZIP
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - run: npm ci

      # The release check runs the browser smoke tests against the packaged app.
      - name: Browser for the smoke tests
        run: npx playwright install --with-deps firefox

      - name: Lint, test, build and package
        run: npm run release:zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          cp "release-build/Divtech-Hisaab-v$V.zip" release-build/Divtech-Hisaab.zip
          # Release notes: the newest CHANGELOG entry (what the app's update window shows).
          awk '/^## \[/{n++} n==1 && !/^---$/' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "release-build/Divtech-Hisaab-v$V.zip" \
            release-build/Divtech-Hisaab.zip \
            --title "Divtech Hisaab v$V" \
            --notes-file release-notes.md

      # The Windows job below turns this ZIP into Divtech-Hisaab-Setup.exe.
      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: release-build/Divtech-Hisaab.zip
          retention-days: 3

  # Divtech-Hisaab-Setup.exe (see windows-setup.yml): built, installed and
  # checked on Windows, then added to the release.
  windows-setup:
    needs: release
    uses: ./.github/workflows/windows-setup.yml
    with:
      publish: true
    permissions:
      contents: write
